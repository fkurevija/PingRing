name: Build APK

on:
  push:
    # Direct pushes to master build and roll the `latest` release forward.
    branches:
      - master
    # Tagged version builds publish a real GitHub Release.
    tags:
      - 'v*'
  # PR merges land as a push to master, so the `branches` filter above already
  # covers them. This additionally builds every PR for review feedback.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Needed by the publish job: creating/updating Releases and the rolling
# `latest` tag requires write access to repository contents.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # For pull_request, actions/checkout defaults to the PR's merge commit,
      # so the build validates the change as it would land on master without
      # needing an explicit ref.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Must be v4, not v3. v3's `packages` input defaults to
      # "tools platform-tools", and Google no longer serves the deprecated
      # tools package, so v3 dies during setup with:
      #   Warning: Failed to find package 'tools'
      # v4 defaults to "platform-tools" only. v4 also defaults to a current
      # cmdline-tools (22.0) rather than v3's 16.0, which predates the API 37
      # minor-version packages and cannot see them.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # API 37 ships as the "37.0" minor release, so the only package
      # sdkmanager offers is platforms;android-37.0. Asking for
      # platforms;android-37 fails outright, and even when the platform is
      # present it lands in the directory android-37.0 while AGP resolves the
      # compileSdk target as android-37. See actions/runner-images#13859.
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      # Bridge the android-37.0 directory to the android-37 name AGP looks
      # for, otherwise the build dies with:
      #   Failed to find target with hash string 'android-37'
      # Done before the build so it applies to the Gradle daemon's SDK scan.
      - name: Alias API 37 platform directory
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          platforms_dir="$sdk_root/platforms"
          if [ -d "$platforms_dir/android-37.0" ] && [ ! -e "$platforms_dir/android-37" ]; then
            ln -s android-37.0 "$platforms_dir/android-37"
            echo "Aliased android-37 -> android-37.0"
          else
            echo "No alias needed; android-37 already resolvable"
          fi
          ls -1 "$platforms_dir" | grep -E '^android-37' || true

      - name: Verify AGP can resolve the compileSdk target
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -f "$sdk_root/platforms/android-37/android.jar" \
            || { echo "::error::android-37/android.jar missing"; exit 1; }
          echo "android-37 target is resolvable"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingring-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Advise rather than act. `latest` is overwritten on every master push, so
      # a build only becomes permanent once tagged, and that is a judgement call
      # about whether a change is worth keeping - not something CI should make
      # on the author's behalf. This surfaces the suggestion in the run summary
      # where it will actually be seen, and stays quiet when only docs, CI or
      # internal changes have landed.
      - name: Suggest a release if the changes are notable
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          python tools/tag_release.py >> "$GITHUB_STEP_SUMMARY"

  # Publishing is a separate job so the release path can be conditioned on
  # the trigger without duplicating the whole Android build.
  publish-apk:
    needs: build-apk
    runs-on: ubuntu-latest
    # Never publish from a pull_request. A PR from a fork gets a read-only
    # GITHUB_TOKEN, so the release steps would fail outright, and rolling
    # `latest` from unreviewed code would publish a build nobody approved.
    # The APK is still downloadable from the build-apk run artifact.
    if: github.event_name != 'pull_request'
    # Always upload the APK as a run artifact regardless of whether a release
    # is published, so a green run is always downloadable.
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: pingring-debug-apk
          path: apk

      # A tag push (v1.2.3) produces a real, immutable versioned release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          name: PingRing ${{ github.ref_name }}
          body: |
            Debug APK for **${{ github.ref_name }}**.

            Commit: ${{ github.sha }}
            Built: ${{ github.run_number }} on ${{ github.actor }}
          fail_on_unmatched_files: true

      # Otherwise roll a single `latest` release/tag forward with the newest
      # master build, so there is always one obvious download. Uses the
      # GitHub CLI rather than a second release action so the existing
      # `latest` release is updated in place instead of duplicated.
      - name: Publish rolling latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk_path="$(find apk -name '*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "::error::No APK found to publish"
            exit 1
          fi

          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Debug APK from the most recent successful non-tag build.

          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Build: ${{ github.run_number }}
          EOF

          # --clobber replaces the asset on an existing release, so repeated
          # runs update `latest` rather than failing on a duplicate filename.
          #
          # `gh release upload` accepts only --clobber and --repo, so the notes
          # cannot be set here: passing --notes-file makes it exit 1 with
          # "unknown flag". Notes are written by `gh release edit` below, which
          # does support it.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$apk_path" --clobber
            gh release edit latest --notes-file "$notes"
            # Keep the rolling tag on the newest commit, so the release page
            # always points at the build it actually contains.
            gh release edit latest --target "${{ github.sha }}" || true
            echo "Updated rolling latest release"
          else
            # Moving the tag keeps the release page pinned to new builds.
            gh release create latest "$apk_path" \
              --title "Latest debug APK" \
              --notes-file "$notes" \
              --target "${{ github.sha }}"
            echo "Created rolling latest release"
          fi
