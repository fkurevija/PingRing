name: Build APK

on:
  workflow_dispatch:

# Needed by the publish job: creating/updating Releases and the rolling
# `latest` tag requires write access to repository contents.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      signed-release-configured: ${{ steps.release-signing.outputs.enabled }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Alias API 37 platform directory
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          platforms_dir="$sdk_root/platforms"
          if [ -d "$platforms_dir/android-37.0" ] && [ ! -e "$platforms_dir/android-37" ]; then
            ln -s android-37.0 "$platforms_dir/android-37"
            echo "Aliased android-37 -> android-37.0"
          else
            echo "No alias needed; android-37 already resolvable"
          fi
          ls -1 "$platforms_dir" | grep -E '^android-37' || true

      - name: Verify AGP can resolve the compileSdk target
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -f "$sdk_root/platforms/android-37/android.jar" \
            || { echo "::error::android-37/android.jar missing"; exit 1; }
          echo "android-37 target is resolvable"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew test --stacktrace

      - name: Generate unit test coverage report
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: app/build/reports/jacoco/jacocoTestReport
          if-no-files-found: warn

      - name: Summarise unit test coverage
        if: ${{ always() }}
        run: |
          python3 tools/coverage_summary.py \
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml \
            80 "JVM unit test coverage" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check release signing configuration
        id: release-signing
        env:
          PINGRING_KEYSTORE_BASE64: ${{ secrets.PINGRING_KEYSTORE_BASE64 }}
          PINGRING_KEYSTORE_PASSWORD: ${{ secrets.PINGRING_KEYSTORE_PASSWORD }}
          PINGRING_KEY_ALIAS: ${{ secrets.PINGRING_KEY_ALIAS }}
          PINGRING_KEY_PASSWORD: ${{ secrets.PINGRING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          missing=0
          for value in \
            "$PINGRING_KEYSTORE_BASE64" \
            "$PINGRING_KEYSTORE_PASSWORD" \
            "$PINGRING_KEY_ALIAS" \
            "$PINGRING_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=1; else missing=1; fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$missing" -eq 1 ]; then
            echo "::error::Release signing requires the keystore, store password, alias, and key password secrets together."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble signed release APK
        if: ${{ steps.release-signing.outputs.enabled == 'true' }}
        env:
          PINGRING_KEYSTORE_BASE64: ${{ secrets.PINGRING_KEYSTORE_BASE64 }}
          PINGRING_KEYSTORE_PASSWORD: ${{ secrets.PINGRING_KEYSTORE_PASSWORD }}
          PINGRING_KEY_ALIAS: ${{ secrets.PINGRING_KEY_ALIAS }}
          PINGRING_KEY_PASSWORD: ${{ secrets.PINGRING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/pingring-release.jks"
          cleanup() { shred -u "$keystore" 2>/dev/null || rm -f "$keystore"; }
          trap cleanup EXIT
          printf '%s' "$PINGRING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          ./gradlew assembleRelease \
            -PPINGRING_KEYSTORE="$keystore" \
            -PPINGRING_KEYSTORE_PASSWORD="$PINGRING_KEYSTORE_PASSWORD" \
            -PPINGRING_KEY_ALIAS="$PINGRING_KEY_ALIAS" \
            -PPINGRING_KEY_PASSWORD="$PINGRING_KEY_PASSWORD"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not configured}}"
          apk="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          "$sdk_root/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Upload signed release APK
        if: ${{ steps.release-signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pingring-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingring-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Suggest a release if the changes are notable
        continue-on-error: true
        run: |
          python3 tools/tag_release.py >> "$GITHUB_STEP_SUMMARY" || \
            echo "::notice::Release suggestion unavailable; continuing."

  # Publishing is a separate job so the release path can be conditioned on
  # the trigger without duplicating the whole Android build.
  publish-apk:
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Repeated at job level as well as workflow level. Job-level permissions
    # replace rather than extend the workflow-level block, so declaring it here
    # makes the requirement explicit and immune to a job-level override being
    # added later. Releases are written through the contents permission, and a
    # read-only token fails with the opaque "Resource not accessible by
    # integration" rather than anything mentioning permissions.
    permissions:
      contents: write
    steps:
      - name: Require signed artifact for versioned releases
        if: startsWith(github.ref, 'refs/tags/v') && needs.build-apk.outputs.signed-release-configured != 'true'
        run: |
          echo "::error::Refusing to publish a versioned release without a configured signed release APK."
          exit 1

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: pingring-debug-apk
          path: apk

      - name: Download signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && needs.build-apk.outputs.signed-release-configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pingring-release-apk
          path: signed-apk

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') && needs.build-apk.outputs.signed-release-configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: signed-apk/*.apk
          name: PingRing ${{ github.ref_name }}
          body: |
            Signed APK for **${{ github.ref_name }}**.

            Commit: ${{ github.sha }}
            Built: ${{ github.run_number }} on ${{ github.actor }}
          fail_on_unmatched_files: true
