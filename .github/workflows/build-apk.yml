name: Build APK

on:
  push:
    # Direct pushes to master build and roll the `latest` release forward.
    branches:
      - master
    # Tagged version builds publish a real GitHub Release.
    tags:
      - 'v*'
  # PR merges land as a push to master, so the `branches` filter above already
  # covers them. This additionally builds every PR for review feedback.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Needed by the publish job: creating/updating Releases and the rolling
# `latest` tag requires write access to repository contents.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # For pull_request, actions/checkout defaults to the PR's merge commit,
      # so the build validates the change as it would land on master without
      # needing an explicit ref.
      # fetch-depth: 0 is required, not an optimisation. tag_release.py reports
      # on what has landed since the last version tag, and the default
      # shallow clone (fetch-depth 1) has neither tags nor history: it saw
      # "no version tag" and "nothing new since the last tag" on a repository
      # with both, then exited non-zero and failed the build.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Must be v4, not v3. v3's `packages` input defaults to
      # "tools platform-tools", and Google no longer serves the deprecated
      # tools package, so v3 dies during setup with:
      #   Warning: Failed to find package 'tools'
      # v4 defaults to "platform-tools" only. v4 also defaults to a current
      # cmdline-tools (22.0) rather than v3's 16.0, which predates the API 37
      # minor-version packages and cannot see them.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # API 37 ships as the "37.0" minor release, so the only package
      # sdkmanager offers is platforms;android-37.0. Asking for
      # platforms;android-37 fails outright, and even when the platform is
      # present it lands in the directory android-37.0 while AGP resolves the
      # compileSdk target as android-37. See actions/runner-images#13859.
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      # Bridge the android-37.0 directory to the android-37 name AGP looks
      # for, otherwise the build dies with:
      #   Failed to find target with hash string 'android-37'
      # Done before the build so it applies to the Gradle daemon's SDK scan.
      - name: Alias API 37 platform directory
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          platforms_dir="$sdk_root/platforms"
          if [ -d "$platforms_dir/android-37.0" ] && [ ! -e "$platforms_dir/android-37" ]; then
            ln -s android-37.0 "$platforms_dir/android-37"
            echo "Aliased android-37 -> android-37.0"
          else
            echo "No alias needed; android-37 already resolvable"
          fi
          ls -1 "$platforms_dir" | grep -E '^android-37' || true

      - name: Verify AGP can resolve the compileSdk target
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -f "$sdk_root/platforms/android-37/android.jar" \
            || { echo "::error::android-37/android.jar missing"; exit 1; }
          echo "android-37 target is resolvable"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingring-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Advise rather than act. `latest` is overwritten on every master push, so
      # a build only becomes permanent once tagged, and that is a judgement call
      # about whether a change is worth keeping - not something CI should make
      # on the author's behalf. This surfaces the suggestion in the run summary
      # where it will actually be seen, and stays quiet when only docs, CI or
      # internal changes have landed.
      #
      # continue-on-error because the step is advisory: tag_release.py exits
      # non-zero to mean "nothing worth tagging", which is a normal outcome
      # rather than a build failure. The `||` fallback covers its other exit
      # codes the same way - no git, no python, anything else - because none of
      # those should turn a green build red.
      - name: Suggest a release if the changes are notable
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          python3 tools/tag_release.py >> "$GITHUB_STEP_SUMMARY" || \
            echo "::notice::Release suggestion unavailable; continuing."

  # Publishing is a separate job so the release path can be conditioned on
  # the trigger without duplicating the whole Android build.
  publish-apk:
    needs: build-apk
    runs-on: ubuntu-latest
    # Never publish from a pull_request. A PR from a fork gets a read-only
    # GITHUB_TOKEN, so the release steps would fail outright, and rolling
    # `latest` from unreviewed code would publish a build nobody approved.
    # The APK is still downloadable from the build-apk run artifact.
    if: github.event_name != 'pull_request'
    # Repeated at job level as well as workflow level. Job-level permissions
    # replace rather than extend the workflow-level block, so declaring it here
    # makes the requirement explicit and immune to a job-level override being
    # added later. Releases are written through the contents permission, and a
    # read-only token fails with the opaque "Resource not accessible by
    # integration" rather than anything mentioning permissions.
    permissions:
      contents: write
    # Always upload the APK as a run artifact regardless of whether a release
    # is published, so a green run is always downloadable.
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: pingring-debug-apk
          path: apk

      # Print the state the publish step depends on, before it runs. A failure in
      # the release step otherwise reports very little: the common causes (no
      # release for the tag, a protected tag, a missing asset) look alike from
      # the outside. This costs one step and makes any future failure readable.
      - name: Report publish state
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "commit:  ${{ github.sha }}"
          echo "ref:     ${{ github.ref }}"
          echo "apk dir:"; ls -l apk/ || true
          echo "tag latest -> $(git rev-parse refs/tags/latest 2>&1 || echo 'absent')"
          echo "release for latest:"
          gh release view latest 2>&1 | head -20 || true
          echo "auth:"
          gh auth status 2>&1 | head -10 || true

      # A tag push (v1.2.3) produces a real, immutable versioned release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # github.ref_name is "v1.2.3"; github.ref would be "refs/tags/v1.2.3",
          # which is not a tag name. Left implicit, the action searches for a
          # release tagged with the full ref and never finds one - the same
          # class of bug that broke the rolling release.
          tag_name: ${{ github.ref_name }}
          files: apk/*.apk
          name: PingRing ${{ github.ref_name }}
          body: |
            Debug APK for **${{ github.ref_name }}**.

            Commit: ${{ github.sha }}
            Built: ${{ github.run_number }} on ${{ github.actor }}
          fail_on_unmatched_files: true

      # Roll the `latest` release forward on every successful build, so there is
      # always exactly one obvious download and it is never stale.
      #
      # This uses the same action as the versioned path rather than a `gh` CLI
      # script. The script branched on `gh release view` and had three ways to
      # fail silently - a missing release took the create path and collided with
      # the existing tag, and any non-zero exit under `set -e` aborted the job
      # after the tag had already been left behind. The action creates-or-updates
      # a release for a tag declaratively, so there is no branch to get wrong.
      - name: Publish rolling latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          # Passed explicitly rather than relying on the action's default of
          # github.token, so the token actually used is visible in the workflow
          # instead of being implicit.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Explicit, and deliberately not derived from github.ref. Without it
          # the action falls back to the ref, and on a push to master that is
          # "refs/heads/master" - it then looks for a release tagged with a
          # branch name, fails to find one, and tries to create or update
          # something that does not exist.
          tag_name: latest
          name: Latest debug APK
          files: apk/*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          body: |
            Rolling debug build from the most recent successful `master` push.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Build: ${{ github.run_number }}

            This release is overwritten on every build. Tagged `v*` releases are
            permanent - see `tools/tag_release.py`.

      # Move the rolling tag to the commit that was just published, so the
      # release page's source link matches the APK it holds. Separate from the
      # step above, and tolerated on failure, so a protected tag can never stop
      # the release itself from being updated.
      - name: Move the latest tag to this build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest
