name: Instrumented Tests

# The JVM unit tests in build-apk.yml cannot see most of this app: a @Composable
# body does not run until Compose composes it, and nothing composes it without a
# device. That leaves the entire UI - every screen, the dialog, the navigation -
# and the platform integration (sensors, notifications, Bluetooth service
# lookups) with no coverage at all from the fast job.
#
# This job is therefore separate rather than a step inside build-apk: an
# emulator boot costs 10-20 minutes and most of that is spent waiting, and
# folding it in would make every APK build that slow for a check that only some
# changes need.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deliberately no `contents: write`. This job only reads the repository and
# uploads reports, so it does not need the permission the release job does.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref. The emulator is the
  # most expensive thing in CI, and the answer for a superseded commit is
  # almost always the same as for the one that replaced it.
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: Compose UI and device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Same API 37 / android-37.0 wrinkle as the APK build, and the same alias:
      # AGP resolves the compileSdk target as android-37, but sdkmanager only
      # offers platforms;android-37.0 and unpacks it under that name.
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Alias API 37 platform directory
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          platforms_dir="$sdk_root/platforms"
          if [ -d "$platforms_dir/android-37.0" ] && [ ! -e "$platforms_dir/android-37" ]; then
            ln -s android-37.0 "$platforms_dir/android-37"
            echo "Aliased android-37 -> android-37.0"
          else
            echo "No alias needed; android-37 already resolvable"
          fi

      # This is VM acceleration, not graphics acceleration - rendering goes through
      # swiftshader either way. The udev rule is what makes /dev/kvm group-writable
      # for the runner user; without it the action's `disable-linux-hw-accel: auto`
      # resolves to `-accel off` and the emulator falls back to software emulation.
      # The action already reports which way it resolved: the
      # `disable Linux hardware acceleration: false` line at the top of the emulator
      # step is the probe result, so `true` there is the signal to act on.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35, deliberately not the app's targetSdk of 37.
      #
      # The device's API level does not have to match the app's compileSdk or
      # targetSdk, and 35 is what the runner image reliably ships, so matching it
      # keeps the system-image download a cache hit instead of a large fetch.
      #
      # This was verified locally against API 37, not 35, which is the caveat worth
      # knowing about. Nothing under test branches on the API level - no assertion
      # reads a version-gated value, and the code being tested is Compose and
      # layout, not a platform API - so the risk is a Compose-version difference
      # between images rather than an API behaviour change. If this job does go
      # red, compare the failure against the two known workarounds first: see the
      # note in PausedClockComposeContentTestRule.

      # While it boots, this action retries `adb -s emulator-5554 shell getprop
      # sys.boot_completed` every two seconds and emits `adb: device 'emulator-5554'
      # not found` plus "The process .../adb failed with exit code 1" on every attempt
      # that lands before the device registers. Those pairs are expected retry noise,
      # but a count of them is diagnostic: 301 of them is exactly the 600s default
      # timeout, and that means the emulator never came up at all rather than that it
      # came up slowly. The step fails only on `Timeout waiting for emulator to boot.`,
      # on the emulator rejecting a command-line parameter, or on the Gradle script
      # itself, so read in this order: `Emulator booted.` (if present, boot was fine
      # and the failure is downstream), then any `FATAL` line from the emulator above
      # the retries (the one seen here was `Not enough space to create userdata
      # partition`, which `disk-size` below fixes), then the Gradle output.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # The action leaves the data partition at whatever size the AVD profile
          # asks for unless this is set, and the runner does not have room for that
          # default. The emulator requires 1.2x the configured size as free space, so
          # the profile's 6144M asks for 7372.80 MB while the runner has only about
          # 6853 MB free. It exits before ever listening on 5554 with
          #   FATAL | Not enough space to create userdata partition.
          # and the step then spends the full boot timeout polling for a device that
          # was never started - which is where the `device 'emulator-5554' not found`
          # wall comes from. 4096M asks for 4915.20 MB, leaving close to 2 GB of
          # headroom, and is more than this app and its tests need.
          disk-size: 4096M
          # A clean boot per run: these tests assert on real framework state, and
          # a leftover notification or sensor registration from a previous run
          # would make a failure look intermittent rather than real.
          disable-animations: true
          # swiftshader rather than the default host GPU: KVM accelerates the CPU but
          # there is no usable GPU passthrough on GitHub's runners, so asking for the
          # host GPU makes the boot flaky rather than faster.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          # -no-metrics: the emulator otherwise prints a metrics-collection warning
          # on every boot, which is only noise today but the warning states it will
          # become a blocking prompt in a future release. A prompt inside this
          # action would hang the step until the job times out instead of failing,
          # so opting out is the cheaper of the two outcomes.
          # The coverage task pulls connectedDebugAndroidTest into its graph, so it
          # has to run inside the emulator step while the device is still up - run
          # it afterwards and it tries to start the suite again against nothing.
          # --continue keeps the report alive when a test fails, which is the case
          # worth having it for; the step still exits non-zero, so a red run stays
          # red rather than being "fixed" by having produced a report.
          script: |
            ./gradlew connectedDebugAndroidTest createDebugAndroidTestCoverageReport \
              --continue --stacktrace

      # The report is uploaded even when the tests fail, because the HTML page
      # is the fastest way to see which assertion broke and on which screen.
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

      # The report is rendered here, not generated: generating it needs
      # connectedDebugAndroidTest, which needs a device, and the emulator step has
      # already torn the device down by now. The raw .ec and the test results are
      # filed under a device-name-shaped directory ("Pixel_10(AVD) - 17"), but the
      # generated report itself is a fixed path, so no globbing is needed.
      - name: Render instrumented coverage summary
        if: always()
        run: |
          report=app/build/reports/coverage/androidTest/debug/connected/report.xml
          if [ ! -f "$report" ]; then
            echo "::warning::No instrumented coverage report was produced"
          else
            python3 tools/coverage_summary.py "$report" 80 \
              "Instrumented coverage" >> "$GITHUB_STEP_SUMMARY"
            cp -r "$(dirname "$report")" coverage-instrumented
          fi

      - name: Upload instrumented coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-coverage
          path: coverage-instrumented
          if-no-files-found: warn