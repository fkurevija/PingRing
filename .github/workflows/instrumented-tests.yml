name: Instrumented Tests

# The JVM unit tests in build-apk.yml cannot see most of this app: a @Composable
# body does not run until Compose composes it, and nothing composes it without a
# device. That leaves the entire UI - every screen, the dialog, the navigation -
# and the platform integration (sensors, notifications, Bluetooth service
# lookups) with no coverage at all from the fast job.
#
# This job is therefore separate rather than a step inside build-apk, and it is
# also the slowest thing in CI by a wide margin: an emulator boot is 10-20
# minutes of mostly waiting, on top of the install and the run itself. Paying
# that on every push to master bought very little - a UI regression is normally
# caught by the unit tests on the same commit, or by whoever runs the app - for
# a 45-minute job that pushed a superseded commit the moment the next push
# arrived.
#
# Emulator runs are expensive and should not consume minutes on every PR or
# master push. Run them for versioned releases or on demand; the fast JVM tests
# remain part of the APK workflow's PR checks.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# `contents: write` is needed only so the last step can push COVERAGE.md to the
# `coverage` branch - the tests themselves just read the repository. It cannot
# re-trigger this workflow: pushes made with GITHUB_TOKEN do not start workflow
# runs, and a push to `coverage` is a branch, not one of the `v*` tags matched
# above.
permissions:
  contents: write

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: Compose UI and device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A failure here is reported, not enforced. The UI is the part the JVM tests
    # cannot see, so a red run is real information - but it should not be able to
    # block a build that is otherwise fine, because a superseded emulator boot or a
    # flaky mount would otherwise stop releases for a reason unrelated to the
    # change. The job still shows as failed in the UI; it just does not gate.
    #
    # Set at the job rather than per-step so it covers every step, including the
    # emulator boot, which is the flakiest part and the most likely to fail for
    # reasons that have nothing to do with the change. Because the job continues,
    # the reporting step below still runs and can say what happened.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Same API 37 / android-37.0 wrinkle as the APK build, and the same alias:
      # AGP resolves the compileSdk target as android-37, but sdkmanager only
      # offers platforms;android-37.0 and unpacks it under that name.
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Alias API 37 platform directory
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          platforms_dir="$sdk_root/platforms"
          if [ -d "$platforms_dir/android-37.0" ] && [ ! -e "$platforms_dir/android-37" ]; then
            ln -s android-37.0 "$platforms_dir/android-37"
            echo "Aliased android-37 -> android-37.0"
          else
            echo "No alias needed; android-37 already resolvable"
          fi

      # This is VM acceleration, not graphics acceleration - rendering goes through
      # swiftshader either way. The udev rule is what makes /dev/kvm group-writable
      # for the runner user; without it the action's `disable-linux-hw-accel: auto`
      # resolves to `-accel off` and the emulator falls back to software emulation.
      # The action already reports which way it resolved: the
      # `disable Linux hardware acceleration: false` line at the top of the emulator
      # step is the probe result, so `true` there is the signal to act on.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35, deliberately not the app's targetSdk of 37.
      #
      # The device's API level does not have to match the app's compileSdk or
      # targetSdk, and 35 is what the runner image reliably ships, so matching it
      # keeps the system-image download a cache hit instead of a large fetch.
      #
      # This was verified locally against API 37, not 35, which is the caveat worth
      # knowing about. Nothing under test branches on the API level - no assertion
      # reads a version-gated value, and the code being tested is Compose and
      # layout, not a platform API - so the risk is a Compose-version difference
      # between images rather than an API behaviour change. If this job does go
      # red, compare the failure against the two known workarounds first: see the
      # note in PausedClockComposeContentTestRule.

      # While it boots, this action retries `adb -s emulator-5554 shell getprop
      # sys.boot_completed` every two seconds and emits `adb: device 'emulator-5554'
      # not found` plus "The process .../adb failed with exit code 1" on every attempt
      # that lands before the device registers. Those pairs are expected retry noise,
      # but a count of them is diagnostic: 301 of them is exactly the 600s default
      # timeout, and that means the emulator never came up at all rather than that it
      # came up slowly. The step fails only on `Timeout waiting for emulator to boot.`,
      # on the emulator rejecting a command-line parameter, or on the Gradle script
      # itself, so read in this order: `Emulator booted.` (if present, boot was fine
      # and the failure is downstream), then any `FATAL` line from the emulator above
      # the retries (the one seen here was `Not enough space to create userdata
      # partition`, which `disk-size` alone did not fix - see the launch script in
      # the step below), then the Gradle output.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # The emulator requires 1.2x the configured data partition as free space.
          # The AVD profile's own 6144M asks for 7372.80 MB while the runner has about
          # 6854 MB free, so the emulator exits before ever listening on 5554 with
          #   FATAL | Not enough space to create userdata partition.
          # and the step then spends the full boot timeout polling for a device that
          # was never started - which is where the `device 'emulator-5554' not found`
          # wall comes from. 4096M asks for 4915.20 MB, leaving close to 2 GB of
          # headroom, and is more than this app and its tests need.
          #
          # Setting this input is not by itself enough, which is why the launch script
          # below exists alongside it. The action writes the value with
          # `printf ... >> config.ini` - a plain append - but avdmanager has already
          # written its own `disk.dataPartition.size` line while creating the AVD, so
          # config.ini ends up holding the key twice and the emulator acts on the
          # first one. A run with this set to 4096M still asked for 7372.80 MB and
          # died on the same FATAL. An append can only ever add a line the emulator
          # has already decided to ignore; the entry has to be replaced, not repeated.
          disk-size: 4096M

          # The only point at which config.ini can still be corrected - this runs after
          # the AVD is created and before the emulator starts. It drops every line
          # mentioning the key and writes exactly one, so the value the emulator picks
          # is ours whichever of the two it would have preferred, and the final line
          # fails the step immediately if that did not hold, rather than letting the
          # boot wait burn all 600 seconds before anything says why.
          #
          # One command per line, path repeated each time, no trailing backslashes:
          # this input goes through the same parser as `script:` below, which splits
          # on every newline and runs each line as its own `sh -c`, so nothing set on
          # one line is visible to the next.
          pre-emulator-launch-script: |
            sed -i '/disk\.dataPartition\.size/d' "$HOME/.android/avd/test.avd/config.ini"
            echo 'disk.dataPartition.size=4096M' >> "$HOME/.android/avd/test.avd/config.ini"
            test "$(grep -c 'disk.dataPartition.size' "$HOME/.android/avd/test.avd/config.ini")" -eq 1
          # A clean boot per run: these tests assert on real framework state, and
          # a leftover notification or sensor registration from a previous run
          # would make a failure look intermittent rather than real.
          disable-animations: true
          # swiftshader rather than the default host GPU: KVM accelerates the CPU but
          # there is no usable GPU passthrough on GitHub's runners, so asking for the
          # host GPU makes the boot flaky rather than faster.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          # -no-metrics: the emulator otherwise prints a metrics-collection warning
          # on every boot, which is only noise today but the warning states it will
          # become a blocking prompt in a future release. A prompt inside this
          # action would hang the step until the job times out instead of failing,
          # so opting out is the cheaper of the two outcomes.
          # The coverage task pulls connectedDebugAndroidTest into its graph, so it
          # has to run inside the emulator step while the device is still up - run
          # it afterwards and it tries to start the suite again against nothing.
          # --continue keeps the report alive when a test fails, which is the case
          # worth having it for; the step still exits non-zero, so a red run stays
          # red rather than being "fixed" by having produced a report.
          #
          # One line deliberately. The action runs parseScript on this input, which
          # splits on every newline and feeds each line to its own `sh -c`, so a `\`
          # continuation is not a continuation at all: the backslash ends up as the
          # last argument and Gradle fails the whole step with
          #   Task '\' not found in root project 'PingRing' and its subprojects.
          # before the second line is ever reached. Comments are safe here - the
          # parser drops lines starting with `#`.
          script: ./gradlew connectedDebugAndroidTest createDebugAndroidTestCoverageReport --continue --stacktrace

      # The report is uploaded even when the tests fail, because the HTML page
      # is the fastest way to see which assertion broke and on which screen.
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      # Non-blocking means the tick can go green over a red suite, which is only
      # safe if the summary says so in as many words. This reads the same results
      # XML the artifacts do and states the verdict either way, so nobody has to
      # open an artifact to find out whether the UI actually passed.
      #
      # if: always() because this is precisely the step that must run on failure.
      - name: Report whether the instrumented tests passed
        if: always()
        run: |
          # `find` rather than a glob: the results sit under a device-named
          # directory whose exact spelling varies by emulator and API level
          # ("Pixel 6 - 35", "Pixel_10(AVD) - 17"), so the one thing worth
          # relying on is the file name, not the path.
          report="$(find app/build/outputs/androidTest-results -name 'TEST-*.xml' 2>/dev/null | head -1)"
          if [ -z "$report" ]; then
            echo "### Instrumented tests: DID NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No results were produced. The emulator failed to boot, or the job was" \
                 "cancelled by a newer push. This is not a pass." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Instrumented tests did not run::No results XML was produced."
            exit 0
          fi
          total="$(grep -o 'tests="[0-9]*"' "$report" | head -1 | tr -dc '0-9')"
          failures="$(grep -o 'failures="[0-9]*"' "$report" | head -1 | tr -dc '0-9')"
          errors="$(grep -o 'errors="[0-9]*"' "$report" | head -1 | tr -dc '0-9')"
          if [ "${failures:-0}" -gt 0 ] || [ "${errors:-0}" -gt 0 ]; then
            echo "### Instrumented tests: FAILED (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$failures failed, $errors errored, of $total tests. The run is green" \
                 "because this failure is advisory - the APK still built and published." \
                 "See the \`instrumented-test-report\` artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Instrumented tests failed::$failures failed, $errors errored (advisory)"
          else
            echo "### Instrumented tests: PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All $total tests passed."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

      # The report is rendered here, not generated: generating it needs
      # connectedDebugAndroidTest, which needs a device, and the emulator step has
      # already torn the device down by now. The raw .ec and the test results are
      # filed under a device-name-shaped directory ("Pixel_10(AVD) - 17"), but the
      # generated report itself is a fixed path, so no globbing is needed.
      - name: Render instrumented coverage summary
        if: always()
        run: |
          report=app/build/reports/coverage/androidTest/debug/connected/report.xml
          # COVERAGE.md is built here, from the same parse as the run summary, so
          # the page in the repository and the summary on this run cannot disagree
          # about what the report said.
          # One echo, one argument: splitting this across lines with a trailing
          # backslash hands echo two arguments, and echo joins them with a space -
          # giving `[run #42] (https://...)`, which Markdown does not treat as a
          # link at all.
          echo "Generated from \`${GITHUB_SHA:0:7}\`, [run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." > COVERAGE.md
          echo >> COVERAGE.md
          if [ ! -f "$report" ]; then
            echo "::warning::No instrumented coverage report was produced"
            # Written anyway. The coverage branch is force-pushed to a single commit
            # per run, so skipping here would leave the previous run's numbers on
            # the page with nothing marking them as stale - and stale figures that
            # read as current are worse than a page saying nothing was produced.
            echo "_No coverage report was produced by this run._" >> COVERAGE.md
          else
            body="$(python3 tools/coverage_summary.py "$report" 80 "Instrumented coverage")"
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$body" >> COVERAGE.md
            cp -r "$(dirname "$report")" coverage-instrumented
          fi

      - name: Upload instrumented coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-coverage
          path: coverage-instrumented
          if-no-files-found: warn

      # The artifact above holds the full JaCoCo HTML report, but GitHub's file
      # browser will not execute index.html and Markdown cannot embed it either, so
      # the drill-down itself cannot live in the repository without publishing
      # Pages - which, for a private repo, needs GitHub Pro and would put the
      # numbers on the public internet. This commits the Markdown summary instead,
      # which GitHub renders natively, and leaves the artifact as the drill-down.
      #
      # One commit per run onto a branch that holds only this file, force-pushed,
      # so `master` history stays clean. Two independent guards stop it looping:
      # pushes made with GITHUB_TOKEN do not start workflow runs, and `coverage`
      # is a branch, so it cannot match the `v*` tag filter.
      - name: Publish coverage page
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f COVERAGE.md ]; then
            # The step that writes it is itself always() and cannot normally be
            # skipped, but if it did fail this keeps the push from failing too.
            printf '_No coverage report was produced by run #%s._\n' \
              "$GITHUB_RUN_NUMBER" > COVERAGE.md
          fi
          site="$(mktemp -d)"
          cp COVERAGE.md "$site/"
          cd "$site"
          git init -q --initial-branch=coverage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COVERAGE.md
          git commit -qm "coverage for ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            coverage
          echo "Page: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/coverage/COVERAGE.md"